# ============================================================================
# dsh-fish-cdda —— DSH bundle patch
# ============================================================================
# 装上之后，profile 只要在 `dsh.profile.bundles` 里列出本包名即生效：
#
#   dsh plugin --profile web add link:/path/to/dsh-fish-cdda
#   （发布版：dsh plugin --profile web add dsh-fish-cdda）
#
# 真正的用户配置在插件自己的 config.json / 设置页里，这里只放默认值。
# ============================================================================

- insert:
    - id: cdda-duty
      name: dsh-fish-cdda
      config:
        enabled: true
        goal: survive 3 days：先解决水、食物和安全住处，再考虑探索；不要主动送死。
        autoplay: false
