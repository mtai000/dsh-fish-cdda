name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install screen / ffmpeg / mono font
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends screen ffmpeg fonts-dejavu-core

      - name: Unit + integration tests
        run: npm test

      - name: Package sanity
        run: npm pack --dry-run
