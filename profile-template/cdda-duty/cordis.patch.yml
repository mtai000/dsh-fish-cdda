# ============================================================================
# 「CDDA 自动玩」回合专用 profile
# ============================================================================
# 这一轮只需要：模型账号 + MCP（cdda-duty 的 tools-core）+ 最小运行时。
# 不希望它带着整台电脑（文件系统 / bash / 联网 / 子代理 / 技能 / goal 循环）。
# 下面这些 id 都是 `dsh --profile headless --dump-default-config` 里的真实条目。
#
# ⚠️ 这是“无人值守的一轮”的权限边界，不是提示词里的嘱咐：
#    DSH 的沙箱只限制写、不限制读；所以能不给的能力就不给。
# ============================================================================

# ── headless 默认关掉、自动玩需要补开的（模型要用账号额度）──────────────────
- id: credentials
  disabled: false
- id: authorization
  disabled: false
- id: deepseek-account
  disabled: false

# ── 命令执行 ────────────────────────────────────────────────────────────────
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: tool-jobs
  disabled: true
- id: jobs
  disabled: true

# ── 文件系统：读 / 写 / 搜 ──────────────────────────────────────────────────
- id: tool-fs
  disabled: true
- id: tool-fs-search
  disabled: true

# ── 联网（CDDA 工具走 MCP，不需要它自己抓网页）──────────────────────────────
- id: tool-web
  disabled: true
- id: web
  disabled: true
- id: web-fetch-http
  disabled: true
- id: web-search-deepseek
  disabled: true
- id: web-deepseek-api
  disabled: true

# ── 子代理 / 工作流：都能绕开工具限制 ───────────────────────────────────────
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: subagent
  disabled: true
- id: subagent-spawn-in-process
  disabled: true
- id: subagent-fork-in-process
  disabled: true
- id: workflow-ptc
  disabled: true
- id: ptc-runtime
  disabled: true
- id: tool-workflow
  disabled: true

# ── 技能：会读文件 ──────────────────────────────────────────────────────────
- id: skill
  disabled: true
- id: skill-filesystem
  disabled: true
- id: tool-skill
  disabled: true

# ── 自动读 AGENTS.md（会把上级目录的私人设定塞进上下文）──────────────────────
- id: agent-instructions
  disabled: true

# ── 目标循环 / 计划模式 / 待办：自动玩由宿主定时器驱动，不需要它自己续 ───────
- id: goal
  disabled: true
- id: command-goal
  disabled: true
- id: tool-goal
  disabled: true
- id: goal-round-driver
  disabled: true
- id: plan-mode
  disabled: true
- id: tool-todo
  disabled: true

# ── 装插件 / 热重载 / 改配置 ────────────────────────────────────────────────
- id: tool-plugin-manager
  disabled: true
- id: plugin-manager
  disabled: true
- id: hmr
  disabled: true
